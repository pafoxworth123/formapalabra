<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descifrador de Palabras | Buscador Scrabble y Apalabrados</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

  <header class="w-full max-w-2xl text-center py-6">
    <h1 class="text-3xl font-extrabold text-blue-700 tracking-tight">FormarPalabras</h1>
    <p class="text-sm text-slate-500 mt-1">Buscador y descifrador de palabras para Scrabble y Apalabrados</p>
  </header>

  <main class="w-full max-w-2xl bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    
    <div class="space-y-4">
      <div>
        <label for="lettersInput" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
          Tus Letras (Usa ? o * para comodines)
        </label>
        <input 
          id="lettersInput" 
          type="text" 
          placeholder="Ej. ARBOL??" 
          class="w-full text-xl font-bold uppercase tracking-widest px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none placeholder-slate-300 transition"
          autocomplete="off"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="startsWithInput" class="block text-xs font-medium text-slate-500 mb-1">Empieza con (opcional)</label>
          <input 
            id="startsWithInput" 
            type="text" 
            placeholder="Ej. C" 
            class="w-full uppercase px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-1 focus:ring-blue-600 focus:outline-none"
          />
        </div>
        <div>
          <label for="containsInput" class="block text-xs font-medium text-slate-500 mb-1">Contiene (opcional)</label>
          <input 
            id="containsInput" 
            type="text" 
            placeholder="Ej. LA" 
            class="w-full uppercase px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-1 focus:ring-blue-600 focus:outline-none"
          />
        </div>
      </div>

      <button 
        id="searchBtn" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-150 shadow-sm flex items-center justify-center space-x-2"
      >
        <span>Buscar Palabras</span>
      </button>
    </div>

    <div id="resultsContainer" class="mt-8 border-t border-slate-100 pt-6 hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-slate-700">Palabras Encontradas</h2>
        <span id="resultsCount" class="text-xs bg-blue-50 text-blue-700 font-bold px-2 py-1 rounded-full">0 palabras</span>
      </div>

      <div id="resultsList" class="space-y-4">
        </div>
    </div>

  </main>

  <script>
    // 1. Spanish Scrabble Tile Point System
    const LETTER_SCORES = {
      'A': 1, 'E': 1, 'O': 1, 'I': 1, 'S': 1, 'N': 1, 'L': 1, 'R': 1, 'U': 1, 'T': 1,
      'D': 2, 'G': 2,
      'C': 3, 'B': 3, 'M': 3, 'P': 3,
      'H': 4, 'F': 4, 'V': 4, 'Y': 4,
      'Q': 5,
      'J': 8, 'Ñ': 8, 'X': 8,
      'Z': 10
    };

    // Calculate Scrabble score for a word
    function getWordScore(word) {
      return word.toUpperCase().split('').reduce((acc, char) => acc + (LETTER_SCORES[char] || 0), 0);
    }

    // 2. Starter Spanish Word List (Expandable with full dictionary file later)
    const DICTIONARY = [
      "ARBOL", "BARCO", "CABRA", "CASA", "SOL", "LUNA", "PALABRA", "JUEGO",
      "TABLERO", "PUNTOS", "BARCA", "BOLA", "ROBA", "ROBO", "LOBOS", "BLUSA",
      "BRAZO", "ZAPATO", "QUESO", "FOCO", "HOYA", "VIAJE", "AZUL", "AMOR",
      "ROMA", "MORA", "RAMO", "ARMANDO", "BLANCO", "NEGRO", "COLOR", "TIERRA",
      "CIELO", "AGUA", "FUEGO", "VIENTO", "CAMINO", "VIDA", "TIEMPO", "MANO"
    ];

    // Helper: Build a frequency map of characters
    function getLetterCounts(str) {
      const map = {};
      for (const char of str.toUpperCase()) {
        map[char] = (map[char] || 0) + 1;
      }
      return map;
    }

    // Main Solver Logic
    function solveWords(rack, startsWith = "", contains = "") {
      rack = rack.toUpperCase();
      startsWith = startsWith.toUpperCase();
      contains = contains.toUpperCase();

      const wildcards = (rack.match(/[\?\*]/g) || []).length;
      const rackCounts = getLetterCounts(rack.replace(/[\?\*]/g, ''));

      return DICTIONARY.filter(word => {
        const upperWord = word.toUpperCase();

        // Check optional filters
        if (startsWith && !upperWord.startsWith(startsWith)) return false;
        if (contains && !upperWord.includes(contains)) return false;

        // Check if word can be formed from available rack letters + wildcards
        const wordCounts = getLetterCounts(upperWord);
        let neededWildcards = 0;

        for (const letter in wordCounts) {
          const available = rackCounts[letter] || 0;
          if (wordCounts[letter] > available) {
            neededWildcards += (wordCounts[letter] - available);
          }
        }

        return neededWildcards <= wildcards;
      });
    }

    // DOM Interaction
    const searchBtn = document.getElementById('searchBtn');
    const lettersInput = document.getElementById('lettersInput');
    const startsWithInput = document.getElementById('startsWithInput');
    const containsInput = document.getElementById('containsInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');

    function performSearch() {
      const letters = lettersInput.value.trim();
      if (!letters) return;

      const matches = solveWords(letters, startsWithInput.value.trim(), containsInput.value.trim());

      // Sort by length descending, then by score descending
      matches.sort((a, b) => b.length - a.length || getWordScore(b) - getWordScore(a));

      // Group matches by word length
      const grouped = {};
      matches.forEach(word => {
        const len = word.length;
        if (!grouped[len]) grouped[len] = [];
        grouped[len].push(word);
      });

      // Render results
      resultsList.innerHTML = '';
      resultsCount.textContent = `${matches.length} palabras`;

      if (matches.length === 0) {
        resultsList.innerHTML = '<p class="text-sm text-slate-400 italic">No se encontraron palabras.</p>';
      } else {
        Object.keys(grouped).sort((a, b) => b - a).forEach(length => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'space-y-2';

          const title = document.createElement('h3');
          title.className = 'text-xs font-bold text-slate-400 tracking-wider uppercase';
          title.textContent = `${length} Letras`;
          groupDiv.appendChild(title);

          const grid = document.createElement('div');
          grid.className = 'flex flex-wrap gap-2';

          grouped[length].forEach(word => {
            const score = getWordScore(word);
            const badge = document.createElement('div');
            badge.className = 'flex items-center space-x-1 bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1 text-sm font-medium';
            badge.innerHTML = `
              <span class="text-slate-800">${word}</span>
              <span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-1 rounded">${score}</span>
            `;
            grid.appendChild(badge);
          });

          groupDiv.appendChild(grid);
          resultsList.appendChild(groupDiv);
        });
      }

      resultsContainer.classList.remove('hidden');
    }

    // Trigger search on button click or Enter key
    searchBtn.addEventListener('click', performSearch);
    lettersInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') performSearch(); });
  </script>
</body>
</html>
